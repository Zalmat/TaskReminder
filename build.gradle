plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'com.reminder'
version = '1.0.0'

repositories {
    mavenCentral()
}

javafx {
    version = "17.0.6"
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.media']  // Добавлен javafx.media
}

dependencies {
    // JavaFX
    implementation 'org.openjfx:javafx-controls:17.0.6'
    implementation 'org.openjfx:javafx-fxml:17.0.6'
    implementation 'org.openjfx:javafx-media:17.0.6'  // Добавлено

    // YAML парсер
    implementation 'org.yaml:snakeyaml:2.0'

    // Excel экспорт
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Логирование
    implementation 'org.slf4j:slf4j-simple:2.0.7'

    // Тестирование
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.1.1'
}

application {
    mainClass = 'com.reminder.App'
    applicationDefaultJvmArgs = [
        '--add-opens=javafx.graphics/com.sun.javafx.application=ALL-UNNAMED',
        '-Dfile.encoding=UTF-8'
    ]
}

// ===== Версия приложения из git (тег → fallback) =====
def githubRepo = 'Zalmat/TaskReminder'

def gitOutput(List<String> args) {
    try {
        def out = new ByteArrayOutputStream()
        exec {
            commandLine(['git'] + args)
            standardOutput = out
            errorOutput = new ByteArrayOutputStream()
            ignoreExitValue = true
        }
        return out.toString().trim()
    } catch (Exception e) {
        return ''
    }
}

def extractSemver(String text) {
    def m = text =~ /(\d+\.\d+\.\d+)/
    return (text != null && m.find()) ? m.group(1) : null
}

def releaseCommit = gitOutput(['rev-parse', '--short', 'HEAD'])
def releaseDescribe = gitOutput(['describe', '--tags', '--always'])
def tagVersion = extractSemver(releaseDescribe)
def releaseVersion = tagVersion ?: (releaseCommit ? "${project.version}-${releaseCommit}" : project.version)
def releaseNumeric = extractSemver(releaseVersion) ?: project.version

def generatedVersionDir = file("$buildDir/generated-resources/version")

tasks.register('generateVersionInfo') {
    def gen = new File(generatedVersionDir, 'version.properties')
    def out = new File("$buildDir/release/version.properties")
    outputs.file(gen)
    outputs.file(out)
    outputs.upToDateWhen { false }
    doLast {
        def content = """# Autogenerated by generateVersionInfo - do not edit
version=${releaseVersion}
numeric=${releaseNumeric}
commit=${releaseCommit}
repository=${githubRepo}
"""
        generatedVersionDir.mkdirs()
        gen.text = content
        new File("$buildDir/release").mkdirs()
        out.text = content
    }
}

sourceSets.main.resources.srcDirs += generatedVersionDir
processResources.dependsOn tasks.named('generateVersionInfo')

jar {
    manifest {
        attributes(
                'Main-Class': 'com.reminder.App',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

shadowJar {
    archiveFileName = "${project.name}-${project.version}-all.jar"
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'com.reminder.App'
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
    sourceCompatibility = '17'
    targetCompatibility = '17'
}